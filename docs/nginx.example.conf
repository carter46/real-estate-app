# Example Nginx + PHP-FPM server block for SDC real-estate-app
# Replace YOUR_DOMAIN, paths, and PHP socket/version.

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    root /var/www/real-estate-app;
    index index.php;

    # Deny sensitive paths (Nginx ignores .htaccess)
    location ^~ /database/ { deny all; }
    location ^~ /storage/ { deny all; }
    location ^~ /vendor/ { deny all; }
    location ^~ /bin/ { deny all; }
    location ^~ /.git/ { deny all; }
    location = /config.local.php { deny all; }
    location ~* \.(md|sql|lock)$ { deny all; }

    # Uploads: serve files, never execute PHP
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock; # adjust
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}

