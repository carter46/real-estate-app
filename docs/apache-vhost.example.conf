# Example Apache 2.4 vhost for SDC real-estate-app
# Requires: mod_rewrite, AllowOverride for .htaccess (or merge rules into vhost).

<VirtualHost *:443>
    ServerName YOUR_DOMAIN
    DocumentRoot /var/www/real-estate-app

    # SSLEngine on
    # SSLCertificateFile /path/to/fullchain.pem
    # SSLCertificateKeyFile /path/to/privkey.pem

    <Directory /var/www/real-estate-app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defense in depth (also covered by app .htaccess when AllowOverride All)
    <DirectoryMatch "/var/www/real-estate-app/(database|storage|vendor|bin)">
        Require all denied
    </DirectoryMatch>
    <Files "config.local.php">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/sdc-error.log
    CustomLog ${APACHE_LOG_DIR}/sdc-access.log combined
</VirtualHost>

# Optional HTTP → HTTPS
# <VirtualHost *:80>
#     ServerName YOUR_DOMAIN
#     Redirect permanent / https://YOUR_DOMAIN/
# </VirtualHost>
